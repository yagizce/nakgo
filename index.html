const isRecord = v => !!v && typeof v === "object" && !Array.isArray(v);
// Turkish mobile and geographic numbers; no letters, extensions or foreign prefixes.
function normalizeListingPhone(value) {
    if(typeof value!=='string'||!/^[+0-9 ()\- .]+$/.test(value)||value.length>32)return '';
    let digits=value.replace(/\D/g,'');
    if(digits.startsWith('0090'))digits=digits.slice(4);
    else if(digits.length===12&&digits.startsWith('90'))digits=digits.slice(2);
    else if(digits.length===11&&digits.startsWith('0'))digits=digits.slice(1);
    return /^[235][0-9]{9}$/.test(digits)&&!/^([0-9])\1{9}$/.test(digits)?'+90'+digits:'';
}
const localDay = (value = Date.now()) => {
    const d = new Date(value);
    return Number.isFinite(d.getTime()) ? [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-") : "";
};
const validDay = d => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d) && localDay(d+"T12:00:00") === d;
const validPostTime = value => typeof value==='string' && /^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(value);
function parsePostDate(value) {
    if(typeof value!=='string')return {date:'',time:''};
    const text=value.trim();
    if(validDay(text))return {date:text,time:''};
    const match=/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?$/.exec(text);
    if(!match)return {date:'',time:''};
    const date=match[3]+'-'+match[2].padStart(2,'0')+'-'+match[1].padStart(2,'0');
    const time=match[4]===undefined?'':match[4].padStart(2,'0')+':'+match[5];
    return validDay(date)&&(!time||validPostTime(time))?{date,time}:{date:'',time:''};
}
const loadingTextOK = value => typeof value==='string' && value.trim().length>0 && value.length<=32;
const postDateText = (date=localDay(),time='') => date.split('-').reverse().join('.')+(validPostTime(time)?' '+time:'');
function dateFields(value, now = Date.now()) {
    if (validDay(value)) return {date:value, dateEnd:""};
    const d = new Date(now); d.setHours(12,0,0,0);
    if (value === "Yarın") d.setDate(d.getDate()+1);
    const days = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
    if (days.includes(value)) d.setDate(d.getDate()+(days.indexOf(value)-d.getDay()+7)%7);
    const date = localDay(d);
    if (value === "Bu hafta") { d.setDate(d.getDate()+(7-d.getDay())%7); return {date,dateEnd:localDay(d)}; }
    return {date,dateEnd:""};
}
function dateOnlyLabel(x, now = Date.now()) {
    if (typeof x === 'object' && typeof x.dateText === 'string') return x.dateText;
    const d = typeof x === "string" ? x : x.date;
    if (!validDay(d)) return String(d || "Belirtilmedi");
    const end = typeof x === "object" && validDay(x.dateEnd) ? x.dateEnd : "";
    const format = v => new Date(v+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"});
    if (end && end !== d) return format(d)+" – "+format(end);
    if (d === localDay(now)) return "Bugün";
    if (d === dateFields("Yarın",now).date) return "Yarın";
    return format(d);
}
const dateLabel = (x,now=Date.now()) => dateOnlyLabel(x,now)+(validPostTime(x?.time)?' · '+x.time:'');
const dateBucket = x => {

        const end = typeof x === "object" && validDay(x.dateEnd) ? x.dateEnd : d, today=localDay();
        if (d <= today && end >= today) return "Bugün";

};
const positiveAmount = value => Number.isFinite(+value) && +value > 0 && +value <= Number.MAX_SAFE_INTEGER;
const postDateOK = value => ["Bugün", "Yarın", "Bu hafta"].includes(value) || validDay(value);
const ITEM_UNITS = ["ton", "kg", "palet", "koli", "adet", "m³"];
function postError(x, isTruck = false, step = 2) {
    if (!cities.includes(x.from) || !cities.includes(x.to)) return "Çıkış ve varış şehrini seç";

function fuelEstimate(values) {

    const distance=values.km*(values.back?2:1), litres=distance*values.cons/100, fuel=litres*values.fuel, extras=values.toll+values.other, total=fuel+extras;
    return [distance,litres,fuel,extras,total].every(v=>Number.isFinite(v)&&v<=Number.MAX_SAFE_INTEGER) ? {distance,litres,fuel,extras,total} : null;

const listingDistance = x => Number.isFinite(+x.km) && +x.km > 0 ? +x.km : dist(x.from,x.to) || 0;
const imageDataOK = (u, max=250000) => typeof u === "string" && u.length < max && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u);
function normalizeListing(v) {
    if (!isRecord(v) || !["number","string"].includes(typeof v.id) || !String(v.id) || typeof v.from !== "string" || typeof v.to !== "string") return null;
    const x={...v};
    for (const k of ["cargo","note","owner","who","veh","body","phone","uid","date"]) if (k in x) x[k]=String(x[k]??"");
    for (const k of ["ton","cap","km","ts","featUntil","stage"]) if(k in x) x[k]=Number.isFinite(+x[k])?Math.max(0,+x[k]):0;
    if(Array.isArray(x.items)) x.items=x.items.filter(isRecord).slice(0,6).map(i=>({n:String(i.n||""),q:positiveAmount(i.q)?+i.q:0,u:String(i.u||"")}));
    else delete x.items;
    if (!imageDataOK(x.img,60000)) delete x.img;
    if (x.mine && !x.ts) {
        const old=Number(String(x.id).replace(/^t/,""));
        x.ts=Number.isFinite(old)&&old>1e12?old:Date.now();
    }
    if ('dateText' in x) x.dateText=String(x.dateText??'');
    if (!('dateText' in x) && (x.mine || x.uid || x.ts) && !validDay(x.date)) Object.assign(x,dateFields(x.date,x.ts||Date.now()));
    if (!validDay(x.dateEnd) || x.dateEnd < x.date) delete x.dateEnd;
    if(Array.isArray(x.featWin)) x.featWin=x.featWin.filter(w=>Array.isArray(w)&&Number.isFinite(+w[0])&&Number.isFinite(+w[1]));

function shrink(file, cb, max, lim) {
    max = max || 720;
    lim = lim || 170000;
    const rd = new FileReader();
    rd.onload = () => {
        const im = new Image();
        im.onload = () => {
            const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
            c.width = Math.round(im.width * k);
            c.height = Math.round(im.height * k);
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            let u = "";
            for (const q of [.6, .45, .3]) {
                u = c.toDataURL("image/jpeg", q);
                if (u.length < lim)
                    break;
            }
            if (u.length >= lim) return toast("Fotoğraf çok büyük; daha küçük bir fotoğraf seç");
            cb(u);
        };
        im.onerror = () => toast("Fotoğraf okunamadı");
        im.src = rd.result;
    };
    rd.onerror = () => toast("Fotoğraf okunamadı");
    rd.readAsDataURL(file);
}

function pickImg(cb, max, lim) {
    const i = document.createElement("input");
    i.type = "file";
    i.accept = "image/*";
    i.onchange = () => {
        const f = i.files && i.files[0];
        if (f)
            shrink(f, cb, max, lim);
    };
    i.click();
}

            '<div class="chips"><button class="chip" id="market-refresh" '+(busy?'disabled':'')+'>İlanları yenile</button>'+((feedMore||ownMore)?'<button class="chip" id="market-more" '+(busy?'disabled':'')+'>Daha fazla ilan yükle</button>':'')+'</div>';
    }
    return {active,guest,locked,requireAccount,token,sync,refresh,create,update,pending,controls,mapped};
})();

// Private favorite membership and pages never enter the device demo store.
const nakgoFavorites = (() => {
    let ids=new Set(),rows=[],ready=false,busy=false,error='',pageReady=false,pageBusy=false,pageError='',before=null,more=false,version=0;
    const pending=new Set();
    const allowed=()=>{const s=nakgoAuth.snapshot();return nakgoMarket.active()&&s.user&&s.profile&&!s.recovery;};
    const reset=()=>{ids=new Set();rows=[];ready=busy=pageReady=pageBusy=more=false;error=pageError='';before=null;version++;pending.clear();};
    const state=()=>({ready,busy,error,pageReady,pageBusy,pageError,more,count:ids.size});
    const has=id=>ids.has(id);
    const disabled=id=>!ready||pending.has(id);
    const listings=()=>rows.filter(r=>r.listing&&ids.has(r.listing_id)).map(r=>nakgoMarket.mapped(r.listing));
    const unavailable=()=>rows.filter(r=>ids.has(r.listing_id)&&(!r.listing||!availableListing(nakgoMarket.mapped(r.listing),r.listing.kind==='truck'))).map(r=>r.listing_id);
    async function refresh() {
        if(!allowed()||busy)return;
        const account=nakgoMarket.token(),revision=version;busy=true;error='';
        render();
        try {
            let cursor=null;const found=new Set();
            for(;;) {
                const page=await nakgoAuth.listFavorites({before:cursor});
                if(account!==nakgoMarket.token()||revision!==version)return;
                page.forEach(r=>found.add(r.listing_id));
                if(page.length<200)break;
                const next=page.at(-1)?.listing_id;
                if(!Number.isSafeInteger(next)||next<1||(cursor!==null&&next>=cursor))throw Error('Invalid favorite cursor');
                cursor=next;
            }
            ids=found;ready=true;rows=[];pageReady=false;pageError='';before=null;more=false;
        } catch(e){if(account===nakgoMarket.token()&&revision===version)error='Kaydettiklerin yüklenemedi. Yeniden dene.';}
        finally {if(account===nakgoMarket.token()){busy=false;render();}}
    }
    async function refreshPage(append=false) {
        if(!allowed()||!ready||busy||pageBusy)return;
        const account=nakgoMarket.token(),revision=version;pageBusy=true;pageError='';render();
        try {
            const page=await nakgoAuth.listFavorites({before:append?before:null,details:true});
            if(account!==nakgoMarket.token()||revision!==version)return;
            const all=new Map((append?rows:[]).map(r=>[r.listing_id,r]));page.forEach(r=>all.set(r.listing_id,r));
            rows=[...all.values()];before=page.at(-1)?.listing_id||null;more=page.length===50;pageReady=true;
        } catch(e){if(account===nakgoMarket.token()&&revision===version)pageError='Kayıtlı ilanlar yüklenemedi. Yeniden dene.';}
        finally {if(account===nakgoMarket.token()){pageBusy=false;render();}}
    }
    function ensure() {
        if(!allowed())return;
        if(!ready&&!busy&&!error)refresh();
        else if(ready&&!busy&&F.fav&&tab==='list'&&!pageReady&&!pageBusy&&!pageError)refreshPage();
    }
    async function setSaved(id,saved) {
        if(!allowed()||!ready||!Number.isSafeInteger(id)||id<1||typeof saved!=='boolean')throw Error('Favorite unavailable');
        if(pending.has(id))return null;
        const account=nakgoMarket.token();pending.add(id);render();
        try {
            const result=await nakgoAuth.setFavorite(id,saved);
            if(account!==nakgoMarket.token())throw Error('Account changed');
            if(result?.listing_id!==id||result.saved!==saved)throw Error('Invalid favorite response');
            version++;if(saved)ids.add(id);else ids.delete(id);
            rows=rows.filter(r=>r.listing_id!==id);pageReady=false;pageError='';error='';return result;
        } finally {if(account===nakgoMarket.token()){pending.delete(id);render();}}
    }
    const updateListing=row=>{rows=rows.map(r=>r.listing_id===row.id?{...r,listing:row}:r);};
    function controls() {
        const problem=error||pageError;
        return (problem?'<p role="alert">'+esc(problem)+'</p>':'')+
            (!ready&&!problem?'<p role="status">Kaydettiklerin yükleniyor…</p>':'')+
            (F.fav||problem?'<div class="chips"><button class="chip" id="favorites-refresh" '+(busy||pageBusy?'disabled':'')+'>Kaydettiklerimi yenile</button></div>':'');
    }
    function bind() {
        if($('#favorites-refresh'))$('#favorites-refresh').onclick=()=>refresh();
        if($('#favorites-more'))$('#favorites-more').onclick=()=>refreshPage(true);
    }
    return {reset,state,has,disabled,listings,unavailable,refresh,refreshPage,ensure,setSaved,controls,bind,updateListing};
})();

// Hesaba bağlı rota alarmları. Eşleşme, kullanıcının zaten okuyabildiği ilanlarda cihazda yapılır;
// "görüldü" zamanı sunucuda tutulur, böylece aynı ilan başka cihazda tekrar bildirilmez.
const nakgoAlerts=(()=>{
    let rows=[],ready=false,busy=false,error='',working=false,version=0;
    const allowed=()=>{const s=nakgoAuth.snapshot();return nakgoMarket.active()&&s.user&&s.profile&&!s.recovery;};
    const reset=()=>{rows=[];ready=busy=working=false;error='';version++;};
    const state=()=>({ready,busy,error,working,count:rows.length});
    const list=()=>rows.map(r=>({...r}));
    const problem=e=>({'23505':'Bu alarm zaten kurulu.','54000':'En fazla 20 rota alarmı kurabilirsin. Önce birini kaldır.','42501':'Bu işlem için hesabının doğrulanmış ve aktif olması gerekir.'}[e?.code]||'Alarm kaydedilemedi. Bağlantını kontrol edip tekrar dene.');
    async function refresh() {
        if(!allowed()||busy)return;
        const account=nakgoMarket.token(),v=version;busy=true;error='';
        try{const data=await nakgoAuth.listRouteAlerts();if(account!==nakgoMarket.token()||v!==version)return;if(!Array.isArray(data))throw Error('Invalid alerts');rows=data;ready=true;}
        catch(e){if(account===nakgoMarket.token()&&v===version)error='Rota alarmların yüklenemedi. Yeniden dene.';}
        finally{if(account===nakgoMarket.token()&&v===version){busy=false;render();}}
    }
    const ensure=()=>{if(allowed()&&!ready&&!busy&&!error)refresh();};
    async function write(operation,done) {
        if(!allowed()||working)return false;
        const account=nakgoMarket.token();working=true;render();
        try{await operation();if(account!==nakgoMarket.token())return false;version++;busy=false;ready=false;await refresh();if(done)toast(done);return true;}
        catch(e){if(account===nakgoMarket.token())toast(problem(e));return false;}
        finally{if(account===nakgoMarket.token()){working=false;render();}}
    }
    const add=input=>write(()=>nakgoAuth.saveRouteAlert(input),'Alarm kuruldu: '+(input.from||'Her yer')+' → '+(input.to||'Her yer'));
    const toggle=(id,active)=>write(()=>nakgoAuth.setRouteAlert(id,active),active?'Alarm açıldı':'Alarm durduruldu');
    const remove=id=>write(()=>nakgoAuth.removeRouteAlert(id),'Alarm kaldırıldı');
    // Yalnız alarm kurulduktan sonra yayınlanan, açık ve başkasına ait ilanlar eşleşir.
    function matches() {
        if(!allowed()||!ready)return [];
        const out=[];
        for(const a of rows) {
            if(!a.active)continue;
            const isT=a.kind==='truck',since=Date.parse(a.created_at),seenAt=Date.parse(a.seen_at);
            for(const l of isT?trucks:loads) {
                if(l.mine||!Number.isFinite(l.ts)||!(l.ts>since)||!availableListing(l,isT))continue;
                if((a.from_city&&l.from!==a.from_city)||(a.to_city&&l.to!==a.to_city)||(a.vehicle&&l.veh!==a.vehicle)||(a.body&&l.body!==a.body))continue;
                out.push({alert:a,listing:l,fresh:l.ts>seenAt});
            }
        }
        return out;
    }
    async function markSeen() {
        if(!allowed()||!ready||!rows.some(a=>a.active))return;
        const account=nakgoMarket.token(),v=version,at=new Date().toISOString();
        try{await nakgoAuth.routeAlertsSeen();if(account===nakgoMarket.token()&&v===version){rows=rows.map(a=>a.active?{...a,seen_at:at}:a);bell();}}
        catch(e){}
    }
    return {reset,state,list,refresh,ensure,add,toggle,remove,matches,markSeen};
})();

// Private conversations never enter yy2 or the legacy demo chat store.
const nakgoMessages=(()=>{
    let epoch=0,version=0,screen=0,timer=null,opening=false,conversations=[],inboxReady=false,inboxBusy=false,inboxError='',inboxBefore=null,inboxMore=false;
    let current=null,messages=[],messageReady=false,messageBusy=false,messageError='',messageMore=false,messageBefore=null,sending=false,sendError='',retry=null;
    let readBusy=false,lastRead=0,pollGeneration=0,pollDelay=8000,draftAccount='',drafts=new Map(),draftWarning='';
    let summaryChecked=0,unread={count:0,ready:false,busy:false,error:''};
    const allowed=()=>{const a=nakgoAuth.snapshot();return nakgoMarket.active()&&a.user&&a.profile&&!a.recovery;};
    const state=()=>({conversations:conversations.map(x=>({...x})),inboxReady,inboxBusy,inboxError,inboxMore,current:current?{...current}:null,messages:messages.map(x=>({...x})),messageReady,messageBusy,messageError,messageMore,sending,sendError,draft:current?(drafts.get(current.id)?.body||''):'',draftWarning,unread:{...unread}});
    const stop=()=>{pollGeneration++;if(timer!==null&&typeof window?.clearTimeout==='function')window.clearTimeout(timer);timer=null;};
    function reset(){stop();if(draftAccount)try{window?.sessionStorage?.removeItem('ng-message-drafts:'+draftAccount);}catch(e){}drafts=new Map();draftAccount='';draftWarning='';readBusy=false;lastRead=0;pollDelay=8000;epoch++;version++;screen++;opening=false;conversations=[];inboxReady=inboxBusy=inboxMore=false;inboxError='';inboxBefore=null;current=null;messages=[];messageReady=messageBusy=messageMore=sending=false;messageError=sendError='';messageBefore=retry=null;summaryChecked=0;unread={count:0,ready:false,busy:false,error:''};}
    const key=()=>$('#sheetBody').dataset.k;
    const active=()=>key()==='account-inbox'||(current&&key()==='account-chat:'+current.id);
    const same=(account,e)=>account===nakgoMarket.token()&&e===epoch;
    const draw=()=>{if(active())paintAccountMessages();};
    function loadDrafts(){
        const account=nakgoAuth.snapshot().user?.id;if(!account||account===draftAccount)return;
        drafts=new Map();draftAccount=account;draftWarning='';
        try{const data=JSON.parse(window?.sessionStorage?.getItem('ng-message-drafts:'+account)||'[]');
            if(Array.isArray(data))for(const row of data.slice(0,50))if(Number.isSafeInteger(row.id)&&row.id>0&&typeof row.body==='string'&&row.body.length<=500&&(!row.nonce||/^[a-f0-9-]{36}$/i.test(row.nonce)))drafts.set(row.id,{id:row.id,body:row.body,nonce:row.nonce||null});
        }catch(e){draftWarning='Taslağı tarayıcıda saklayamadık. Göndermeden önce depolama erişimini kontrol et.';}
    }
    function saveDraft(body,nonce=null){
        if(!allowed()||!current)return false;loadDrafts();
        const old=drafts.get(current.id),value=String(body).slice(0,500);
        if(value&&!old&&drafts.size>=50){draftWarning='Önce eski mesaj taslaklarından birini tamamla.';return false;}
        const record={id:current.id,body:value,nonce:nonce||(old?.body.trim()===value.trim()?old.nonce:null)};
        if(value)drafts.set(current.id,record);else drafts.delete(current.id);
        try{window?.sessionStorage?.setItem('ng-message-drafts:'+draftAccount,JSON.stringify([...drafts.values()]));draftWarning='';return true;}
        catch(e){draftWarning='Taslağı tarayıcıda saklayamadık. Göndermeden önce depolama erişimini kontrol et.';return false;}
    }
    const atBottom=()=>{const log=$('#msgs');return Number.isFinite(log.clientHeight)&&log.clientHeight>0&&log.scrollHeight-log.scrollTop-log.clientHeight<40;};
    async function acknowledge(){
        if(!allowed()||!current||readBusy||!messageReady||key()!=='account-chat:'+current.id||document.visibilityState==='hidden'||!atBottom())return;
        const through=messages.at(-1)?.id;if(!through||through<=lastRead)return;
        const account=nakgoMarket.token(),e=epoch,view=screen,id=current.id;readBusy=true;
        try{await nakgoAuth.readConversation(id,through);if(same(account,e)&&view===screen){lastRead=Math.max(lastRead,through);version++;unread.ready=false;refreshSummary();}}
        catch(e1){if(same(account,e)&&view===screen)messageError='Okundu bilgisi kaydedilemedi. Yenile ile tekrar dene.';}
        finally{if(same(account,e)&&view===screen){readBusy=false;draw();}}
    }
    function schedule(){
        stop();if(!active()||typeof window?.setTimeout!=='function')return;
        const generation=pollGeneration,account=nakgoMarket.token(),e=epoch,view=screen;
        timer=window.setTimeout(async()=>{
            timer=null;if(!active()||generation!==pollGeneration||!same(account,e)||view!==screen)return;
            if(document.visibilityState!=='hidden'){
                if(key()==='account-inbox')await refreshInbox();else await refreshMessages();
                pollDelay=(key()==='account-inbox'?inboxError:messageError)?Math.min(pollDelay*2,60000):8000;
            }
            if(generation===pollGeneration&&same(account,e)&&view===screen&&active())schedule();
        },pollDelay);
    }
    async function refreshSummary(){
        if(!allowed()||unread.busy)return;
        const account=nakgoMarket.token(),e=epoch,v=version;unread.busy=true;unread.error='';
        try{const count=await nakgoAuth.unreadMessages();if(same(account,e)&&v===version){if(!Number.isSafeInteger(count)||count<0)throw Error('Invalid unread count');unread={count,ready:true,busy:true,error:''};}}
        catch(e1){if(same(account,e)&&v===version)unread.error='Mesaj sayısı yüklenemedi';}
        finally{if(same(account,e)){unread.busy=false;summaryChecked=Date.now();if(tab==='me')render();}}
    }
    function ensure(){if(allowed()&&!unread.busy&&((!unread.ready&&!unread.error)||Date.now()-summaryChecked>15000))refreshSummary();}
    async function refreshInbox(append=false){
        if(!allowed()||inboxBusy)return;
        const account=nakgoMarket.token(),e=epoch,v=version;inboxBusy=true;inboxError='';draw();
        try{const page=await nakgoAuth.listConversations(append?inboxBefore:null);if(!same(account,e)||v!==version)return;
            const initial=!inboxReady,all=new Map((initial?[]:conversations).map(c=>[c.id,c]));page.forEach(c=>all.set(c.id,c));conversations=[...all.values()].sort((a,b)=>b.last_message_id-a.last_message_id||b.id-a.id);inboxReady=true;
            if(append||initial){inboxMore=page.length===50;const last=page.at(-1);inboxBefore=last?{activity:last.last_message_id,id:last.id}:null;}
        }catch(e1){if(same(account,e))inboxError='Görüşmeler yüklenemedi. Yeniden dene.';}
        finally{if(same(account,e)){inboxBusy=false;draw();}}
    }
    function openInbox(){if(!allowed())return;stop();screen++;current=null;messages=[];retry=null;pollDelay=8000;$('#sheetBody').dataset.k='account-inbox';paintAccountMessages();syncDetailViewport();$('#sheet').classList.add('open');unChat=stop;refreshInbox().then(schedule);refreshSummary();}
    async function openListing(id){
        if(nakgoMarket.guest())return nakgoMarket.requireAccount();
        if(!allowed()||opening)return;const account=nakgoMarket.token(),e=epoch,view=++screen;opening=true;stop();
        $('#sheetBody').dataset.k='account-opening';$('#sheetBody').innerHTML='<div class="detail-top"><b>Görüşme açılıyor…</b><button class="chip" id="close">Kapat ×</button></div>';$('#close').onclick=closeSheet;$('#sheet').classList.add('open');
        try{const row=await nakgoAuth.openConversation(id);if(!same(account,e)||view!==screen||key()!=='account-opening')return;openConversation(row);}
        catch(e1){if(same(account,e)&&view===screen&&key()==='account-opening'){closeSheet();toast('Görüşme açılamadı. İlanları yenileyip tekrar dene.');}}
        finally{if(same(account,e))opening=false;}
    }
    function openConversation(row){
        if(!allowed())return;stop();screen++;loadDrafts();current={...row};messages=[];readBusy=false;lastRead=Number(row.owner_id===nakgoAuth.snapshot().user.id?row.owner_read_id:row.guest_read_id)||0;pollDelay=8000;messageReady=messageBusy=messageMore=sending=false;messageError=sendError='';messageBefore=null;const draft=drafts.get(row.id);retry=draft?.nonce?{id:row.id,body:draft.body.trim(),nonce:draft.nonce}:null;
        $('#sheetBody').dataset.k='account-chat:'+row.id;paintAccountMessages();syncDetailViewport();$('#sheet').classList.add('open');unChat=stop;refreshMessages().then(schedule);
    }
    async function refreshMessages(append=false){
        if(!allowed()||!current||messageBusy||sending)return;
        const account=nakgoMarket.token(),e=epoch,view=screen,v=version,id=current.id;messageBusy=true;messageError='';draw();
        try{const page=await nakgoAuth.listMessages(id,append?messageBefore:null);if(!same(account,e)||view!==screen||v!==version)return;
            const overlaps=page.some(m=>messages.some(old=>old.id===m.id));
            const keep=append||overlaps;
            const all=new Map((keep?messages:[]).map(m=>[m.id,m]));page.forEach(m=>all.set(m.id,m));messages=[...all.values()].sort((a,b)=>a.id-b.id);
            if(append||!keep){messageMore=page.length===50;messageBefore=messages[0]?.id||null;}messageReady=true;
            draw();
            await acknowledge();
        }catch(e1){if(same(account,e)&&view===screen)messageError='Mesajlar yüklenemedi. Yeniden dene.';}
        finally{if(same(account,e)&&view===screen){messageBusy=false;draw();}}
    }
    async function send(body){
        if(!allowed()||!current||sending||typeof body!=='string'||!body.trim()||body.trim().length>500)return null;
        const account=nakgoMarket.token(),e=epoch,view=screen,id=current.id,text=body.trim();
        if(!retry||retry.id!==id||retry.body!==text){if(typeof window?.crypto?.randomUUID!=='function')throw Error('Secure message ID unavailable');retry={id,body:text,nonce:window.crypto.randomUUID()};}
        const request={...retry};if(!saveDraft(text,request.nonce)){sendError=draftWarning;draw();throw Error('Message draft storage unavailable');}sending=true;sendError='';draw();
        try{const row=await nakgoAuth.sendMessage(id,text,request.nonce);if(!same(account,e)||view!==screen)throw Error('Account or conversation changed');
            if(row.conversation_id!==id||row.body!==text||row.sender_id!==nakgoAuth.snapshot().user.id||row.client_nonce!==request.nonce)throw Error('Invalid message response');
            version++;const all=new Map(messages.map(m=>[m.id,m]));all.set(row.id,row);messages=[...all.values()].sort((a,b)=>a.id-b.id);messageReady=true;retry=null;saveDraft('');unread.ready=false;return row;
        }catch(e1){if(same(account,e)&&view===screen)sendError='Mesaj gönderilemedi. Yazdığın metin korunuyor; tekrar dene.';throw e1;}
        finally{if(same(account,e)&&view===screen){sending=false;draw();refreshSummary();}}
    }
    return {reset,state,ensure,refreshSummary,refreshInbox,openInbox,openListing,openConversation,refreshMessages,acknowledge,saveDraft,send,stop};
})();

/**
 * İlan listesi ve ilanlarım
 * Liste kartları, filtre, sıralama, yakınımda, ilan yönetimi; kendi ilanlarını düzenleme, kapatma ve silme.
 */

// ===== İlan listesi =====
// Liste kartları, filtre, sıralama, yakınımda.

function F0() {
    return { veh: [], body: [], date: [], from: "", to: "", tonMin: "", tonMax: "", fav: false };
}

function routeSearch() {
    const field = (key, label) => `<div><label for="route-${key}">${label}</label><select id="route-${key}" data-route="${key}"><option value="">Tüm şehirler</option>${cities.map(c => `<option value="${c}" ${F[key] === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>`;
    return `<section class="route-search" aria-labelledby="route-heading"><div class="route-search-heading"><span class="eyebrow">${mode === "truck" ? "BOŞ ARAÇLARI KEŞFET" : "YÜKLERİ KEŞFET"}</span><h2 id="route-heading">Rotanı seç, <em>yola çık.</em></h2></div><div class="route-fields">${field("from", "Nereden?")}<button class="route-swap" id="route-swap" aria-label="Çıkış ve varış şehirlerini değiştir" title="Güzergâhı ters çevir">⇄</button>${field("to", "Nereye?")}</div></section>`;
}

const isFavorite=x=>nakgoMarket.active()?nakgoFavorites.has(x.remoteId):favs.includes(String(x.id));
const favoriteDisabled=x=>nakgoMarket.active()&&nakgoFavorites.disabled(x.remoteId)?' disabled':'';
const listingSource=isT=>nakgoMarket.active()&&F.fav?nakgoFavorites.listings().filter(x=>(typeof x.id==='string')===isT):(isT?trucks:loads);
async function changeAccountFavorite(id,saved) {
    const account=nakgoMarket.token();
    try {const result=await nakgoFavorites.setSaved(id,saved);if(result)toast(saved?'İlan hesabına kaydedildi':'İlan kaydın kaldırıldı');}
    catch(e){if(account===nakgoMarket.token())toast('Kaydın değiştirilemedi. Bağlantını kontrol edip tekrar dene.');}
}

function match(x, isT) {
    if (F.veh.length && !F.veh.includes(x.veh))
        return 0;
    if (F.body.length && !F.body.includes(x.body))
        return 0;
    if (F.from && x.from !== F.from)
        return 0;
    if (F.to && x.to !== F.to)
        return 0;
    const t = isT ? x.cap : x.ton;
    if (F.tonMin !== "" && t < +F.tonMin)
        return 0;
    if (F.tonMax !== "" && t > +F.tonMax)
        return 0;
    if (F.date.length && !F.date.includes(dateBucket(x)))
        return 0;
    if (F.fav && !isFavorite(x))
        return 0;
return 1;
}

function fcount() {
    return ["veh", "body", "date"].filter(k => F[k].length).length + (F.from ? 1 : 0) + (F.to ? 1 : 0) + ((F.tonMin !== "" || F.tonMax !== "") ? 1 : 0) + (F.fav ? 1 : 0);
}

function activeChips() {
    const a = [];
    ["veh", "body", "date"].forEach(k => F[k].forEach(v => a.push([k, v, v])));
    if (F.from)
        a.push(["from", "", "Çıkış: " + F.from]);
    if (F.to)
        a.push(["to", "", "Varış: " + F.to]);
    if (F.tonMin !== "" || F.tonMax !== "")
        a.push(["ton", "", (F.tonMin || 0) + "–" + (F.tonMax || "∞") + " ton"]);
    if (F.fav)
        a.push(["fav", "", "♥ Kayıtlılar"]);
    return a;
}

function rmF(k, v) {
    if (Array.isArray(F[k]))
        F[k] = F[k].filter(x => x !== v);
    else if (k === "ton") {
        F.tonMin = F.tonMax = "";
    }
    else
        F[k] = "";
    render();
}

const place = (city, district) => esc(city) + (district ? `<small class="district">${esc(district)}</small>` : "");
const routeText = x => [[x.from, x.fromD], [x.to, x.toD]].map(([c, d]) => d ? `${c} (${d})` : c).join(" → ");
const routeHTML = x => `${place(x.from, x.fromD)}<i></i>${place(x.to, x.toD)}`;
const routeTitle = x => `<div class="route route-title"><span>${place(x.from, x.fromD)}</span><i aria-hidden="true"></i><span>${place(x.to, x.toD)}</span></div>`;

const cardRoute = x => `<div class="card-route"><div><small>Nereden</small><b>${place(x.from, x.fromD)}</b></div><i aria-hidden="true"></i><div><small>Nereye</small><b>${place(x.to, x.toD)}</b></div></div>`;
const cargoIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9M7.5 5.5l9 5"/></svg>`;

const lCard = l => `<article class="load ${isF(l) ? "feat" : ""}" data-id="${esc(l.id)}" role="button" tabindex="0" aria-label="${esc(l.from)} → ${esc(l.to)}, ${esc(l.ton)} ton yük, ilanı aç">
    ${isF(l) ? `<div class="listing-label"><span class="tag ft">Öne çıkan${isDemoFeature(l) ? ' · Örnek' : ''}</span></div>` : ""}<div class="card-main contact-card">${cardRoute(l)}<div class="card-contact"><span>${l._remote?"İlan detayları":"Doğrudan görüş"}</span><b>${l._remote?"Yük bilgilerini incele":"Ara veya mesajlaş"}</b></div></div>
    <div class="cargo-line">${imgOk(l.img) ? `<img class="th" src="${l.img}" alt="Yük fotoğrafı">` : `<span class="cargo-icon">${cargoIcon}</span>`}<span><b>${esc(l.cargo)}</b>${Array.isArray(l.items) && l.items.length ? " · +" + l.items.length + " kalem" : ""}</span><span class="cargo-ton"><b>${esc(l.ton)}</b> ton</span></div>
    <div class="listing-spec"><span>${esc(l.veh)} · ${esc(l.body || "Kasa belirtilmedi")}</span><span class="load-date">Yükleme: <b>${esc(dateLabel(l))}</b></span></div>
    <div class="listing-footer"><span class="listing-trust"><span>${nearTxt(l)}${l.km ? "≈ " + l.km + " km" : ""}${ago(l) ? " · " + ago(l) : ""}</span></span><button type="button" aria-label="${isFavorite(l) ? "Kaydı kaldır" : "Kaydet"}" aria-pressed="${isFavorite(l)}" class="fav ${isFavorite(l) ? "on" : ""}" data-fav="${esc(l.id)}"${favoriteDisabled(l)}>${isFavorite(l) ? "♥" : "♡"}</button></div>
    </article>`;

const tCard = t => `<article class="load ${isF(t) ? "feat" : ""}" data-tid="${esc(t.id)}" role="button" tabindex="0" aria-label="${esc(t.from)} → ${esc(t.to)}, ${esc(t.cap)} ton boş araç, ilanı aç">${isF(t) ? '<div class="listing-label"><span class="tag ft">Öne çıkan</span></div>' : ""}<div class="card-main">${cardRoute(t)}<div class="capacity-summary"><span>Boş kapasite</span><strong class="capacity-value">${esc(t.cap)}<small> ton</small></strong></div></div><div class="cargo-line"><span class="cargo-icon">${cargoIcon}</span><span><b>${esc(t.who || nm(t.uid))}</b></span></div><div class="listing-spec"><span>${esc(t.veh)} · ${esc(t.body)}</span><span>Müsait: <b>${esc(dateLabel(t))}</b></span></div><div class="listing-footer"><span class="listing-trust"><span>${nearTxt(t)}${ago(t)}</span></span><button type="button" aria-label="${isFavorite(t) ? "Kaydı kaldır" : "Kaydet"}" aria-pressed="${isFavorite(t)}" class="fav ${isFavorite(t) ? "on" : ""}" data-fav="${esc(t.id)}"${favoriteDisabled(t)}>${isFavorite(t) ? "♥" : "♡"}</button></div></article>`;

function openFilter() {
    const isT = mode === "truck", B = $("#sheetBody");
    const cnt = () => listingSource(isT).filter(x => visibleListing(x, isT)).length;
    const grp = (k, t, o) => `<label>${t}</label><div class="chips wrap">${o.map(v => `<button class="chip ${F[k].includes(v) ? "on" : ""}" data-g="${k}" data-v="${v}">${v}</button>`).join("")}</div>`;
    const sel = (k, t, o) => `<div><label>${t}</label><select data-s="${k}"><option value="">Hepsi</option>${o.map(c => `<option ${F[k] === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>`;
    B.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">Filtrele</b><button class="chip" id="fr">Sıfırla</button></div>`
        + grp("veh", "Araç tipi", vehicles) + grp("body", "Kasa tipi", bodies)
        + `<div class="row">${sel("from", "Nereden", cities)}${sel("to", "Nereye", cities)}</div>`
        + `<div class="row"><div><label>${isT ? "Boş kapasite" : "Yük"}: en az (ton)</label><input data-n="tonMin" type="number" inputmode="decimal" value="${F.tonMin}"></div><div><label>En çok (ton)</label><input data-n="tonMax" type="number" inputmode="decimal" value="${F.tonMax}"></div></div>`
        + grp("date", "Yükleme günü", ["Bugün", "Yarın", "İleri tarih"])
        + `<label>Kayıtlılar</label><div class="chips"><button class="chip ${F.fav ? "on" : ""}" id="ff">♥ Sadece kayıtlı olanlar</button></div><button class="btn" id="fs" style="position:sticky;bottom:0"></button>`;
    const upd = () => {
        $("#fs").textContent = cnt() + (isT ? " boş aracı göster" : " ilanı göster");
    };
    B.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
        tog(F[b.dataset.g], b.dataset.v);
        b.classList.toggle("on");
        upd();
    });
    B.querySelectorAll("[data-s]").forEach(e => e.onchange = () => {
        F[e.dataset.s] = e.value;
        upd();
    });
    B.querySelectorAll("[data-n]").forEach(e => e.oninput = () => {
        F[e.dataset.n] = e.value;
        upd();
    });
    $("#ff").onclick = e => {
        F.fav = !F.fav;
        e.currentTarget.classList.toggle("on", F.fav);
        upd();
    };
    $("#fr").onclick = () => {
        F = F0();
        openFilter();
    };
    $("#fs").onclick = () => {
        closeSheet();
        render();
    };
    upd();
    $("#sheet").classList.add("open");
}

const dKm = x => myPos && LL[x.from] ? hav(myPos, LL[x.from]) : 9e9;

const nearTxt = x => nearOn && myPos && LL[x.from] ? `<b>Sana ${Math.round(dKm(x))} km</b> · ` : "";

function toggleNear() {
    if (nearOn) {
        nearOn = false;
        render();
        return;
    }
    if (myPos) {
        nearOn = true;
        render();
        return;
    }
    if (typeof navigator === "undefined" || !navigator.geolocation)
        return toast("Bu cihaz konumu desteklemiyor");
    toast("Konum alınıyor...");
    navigator.geolocation.getCurrentPosition(p => {
        myPos = [p.coords.longitude, p.coords.latitude];
        myCity = nearestCity(myPos);
        nearOn = true;
        render();
        toast("Konumun: " + myCity + " civarı");
    }, e => toast(e && e.code === 1 ? "Konum izni verilmedi. Tarayıcı ayarlarından izin verebilirsin." : "Konum alınamadı"), { timeout: 10000, maximumAge: 600000 });
}

const nearRow = () => nearOn ? `<div class="chips" aria-label="Yakınlık mesafesi">${[100, 250, 500, 0].map(k => `<button class="chip ${nearR === k ? "on" : ""}" data-nr="${k}">${k ? k + " km" : "Tümü"}</button>`).join("")}</div>` : "";

const sortL = a => sort === "km" ? [...a].sort((x, y) => (listingDistance(x) || 9e9) - (listingDistance(y) || 9e9)) : a;

// ===== İlanlarım =====
// Kendi ilanlarını ve boş araçlarını düzenleme, kapatma, silme, ilan verirken kalem ve süre yardımcıları.

function postTruck(t) {
    if(nakgoMarket.locked())return nakgoMarket.pending();
    const error = postError(t, true);
    if (error) { toast(error); return false; }
    Object.assign(t, dateFields(t.date), {ts:Date.now()});
    if (myCar.phone)
        t.phone = myCar.phone;
    if (cloud) {
        t.uid = me;
        t.ts = Date.now();
        delete t.who;
        dbw(db.doc("trucks/" + t.id).set(t));
    }
    if (!cloud)
        t.mine = true;
    trucks.unshift(t);
    return save();
}

const mineL = () => loads.filter(l => cloud ? l.uid === me : l.mine);

const mineT = () => trucks.filter(t => cloud ? t.uid === me : t.mine);

const findIt = (k, id) => {
    const saved=nakgoMarket.active()?nakgoFavorites.listings().filter(x=>(typeof x.id==='string')===(k!=="l")):[];
    const feed=k==='l'?loads:trucks;
    return (F.fav?[...saved,...feed]:[...feed,...saved]).find(x=>String(x.id)===String(id));
};

function patchIt(k, id, patch) {
    if(nakgoMarket.active())return nakgoMarket.update(k,id,patch).catch(e=>{toast(nakgoAuth.message(e));return false;});
    const it = findIt(k, id);
    if (!it)
        return;
    Object.assign(it, patch);
    if (!save()) return false;
    if (cloud)
        dbw(db.doc((k === "l" ? "loads/" : "trucks/") + id).update(patch));
    render();
    return true;
}

function openEdit(k, id, reopen=false) {
    const it = findIt(k, id);
    if (!it)
        return;
    const B = $("#sheetBody"), L = k === "l";
    B.dataset.k = "";
    B.innerHTML = `<b style="font-size:19px">İlanı düzenle</b><div class="route" style="margin-top:10px">${routeHTML(it)}</div>${L ? "" : `<label>Boş kapasite (ton)</label><input id="ep" type="number" inputmode="decimal" value="${esc(it.cap)}">`}<label>${L ? "Yükleme günü" : "Müsait olduğun gün"}</label>${L && 'dateText' in it ? `<input id="ed" type="text" maxlength="32" required value="${esc(it.dateText)}">` : `<select id="ed">${[...new Set(["Bugün", "Yarın", "Bu hafta", it.date])].map(d => `<option ${it.date === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>`}${L ? `<label>Not</label><textarea id="en" maxlength="1000" rows="3">${esc(it.note || "")}</textarea>` : ""}<button class="btn" id="es">Kaydet</button><button class="btn alt" id="close">Vazgeç</button>`;
    $("#es").onclick = async () => {
        const v = L ? 0 : +$("#ep").value;
        if (!L && !positiveAmount(v))
            return toast("Geçerli bir değer gir");
        const patch = L ? { date: $("#ed").value, note: $("#en").value.trim().slice(0, 1000) } : { cap: v, date: $("#ed").value };
        const selectedDate=$("#ed").value;
        if (L && 'dateText' in it) {
            if (!loadingTextOK(selectedDate)) return toast('Yükleme tarihini yaz');
            delete patch.date; Object.assign(patch,{dateText:selectedDate.trim(),date:'',dateEnd:'',time:''});
        } else if (!postDateOK(selectedDate)) return toast("Geçerli bir tarih seç");
        if (!('dateText' in patch) && selectedDate !== it.date) Object.assign(patch,dateFields(selectedDate));
        if (reopen) {
            const end = selectedDate === it.date ? (it.dateEnd||it.date) : (patch.dateEnd||patch.date);
            if (!('dateText' in patch) && end<localDay()) return toast("Yeniden açmak için güncel bir yükleme tarihi seç");
            Object.assign(patch,{closed:false,ts:Date.now()});
        }
        const button=$('#es'); if(nakgoMarket.active()){if(button.disabled)return;button.disabled=true;}
        const result=patchIt(k,id,patch);
        if (!(result && typeof result.then==='function' ? await result : result)) {button.disabled=false;return;}
        closeSheet();
        toast("İlan güncellendi");
    };
    $("#close").onclick = closeSheet;
    $("#sheet").classList.add("open");
}

function askDel(k, id) {
    const it = findIt(k, id);
    if (!it)
        return;
    const B = $("#sheetBody");
    B.dataset.k = "";
    B.innerHTML = `<b style="font-size:19px">İlan silinsin mi?</b><div class="route" style="margin-top:10px">${routeHTML(it)}</div><p style="margin-top:10px;font-size:14px;color:var(--mute)">${nakgoMarket.active()?"İlan yayından kaldırılır ve arşivlenir.":"Bu işlem geri alınamaz."}</p><button class="btn" id="yes">Evet, sil</button><button class="btn alt" id="close">Vazgeç</button>`;
    $("#yes").onclick = async () => {
        if(nakgoMarket.active()) {
            const button=$("#yes"); if(button.disabled)return; button.disabled=true;
            if(!await patchIt(k,id,{archived:true})){button.disabled=false;return;}
            closeSheet();toast("İlan yayından kaldırıldı");return;
        }
        if (cloud)
            dbw(db.doc((k === "l" ? "loads/" : "trucks/") + id).delete());
        if (k === "l")
            loads = loads.filter(x => String(x.id) !== String(id));
        else
            trucks = trucks.filter(x => String(x.id) !== String(id));
        if (!save()) return;
        closeSheet();
        render();
        toast("İlan silindi");
    };
    $("#close").onclick = closeSheet;
    $("#sheet").classList.add("open");
}

const myListHTML = () => {
    const a = [...mineL().map(l => ({ k: "l", id: l.id, r: routeText(l), v: l.ton + " ton", c: l.closed || expired(l, "load"), s: statLine(l), ff: isF(l) ? Math.max(1, Math.ceil((l.featUntil - Date.now()) / 36e5)) : 0 })), ...mineT().map(t => ({ k: "t", id: t.id, r: routeText(t), v: t.cap + " ton", c: t.closed || expired(t, "truck"), ff: isF(t) ? Math.max(1, Math.ceil((t.featUntil - Date.now()) / 36e5)) : 0 }))];
    return `<div class="load" style="cursor:default"><b>İlanlarım</b>${a.length ? a.map(x => `<div class="kv" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${esc(x.r)}</b><span>${esc(x.v)}</span></div>${x.s ? `<div style="font-size:12.5px;color:var(--mute);margin-top:4px">${x.s}</div>` : ""}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center"><span class="tag">${x.k === "l" ? "Yük" : "Boş araç"}${x.c ? " · kapalı" : ""}${x.ff ? ` · öne çıkan (${x.ff} sa)` : ""}</span><button class="chip" data-me="${x.k}|${esc(x.id)}">Düzenle</button>${x.k === "l" && !nakgoMarket.active() ? `<button class="chip" data-st2="${esc(x.id)}">İstatistik</button>` : ""}${!x.c ? `<button class="chip" data-ft="${x.k}|${esc(x.id)}">${x.ff ? "Uzat" : "Öne çıkar"}</button>` : ""}<button class="chip" data-mc="${x.k}|${esc(x.id)}">${x.c ? "Yeniden aç" : "Kapat"}</button><button class="chip" data-md2="${x.k}|${esc(x.id)}">Sil</button></div></div>`).join("") : `<p style="margin-top:8px;font-size:13px;color:var(--mute)">Henüz ilan vermedin. İlan ver sekmesinden ekleyebilirsin.</p>`}</div>`;
};

const itemsTxt = l => (Array.isArray(l.items) ? l.items : []).slice(0, 6).map(i => esc(i.n) + " " + (+i.q || 0) + " " + esc(i.u)).join(", ");

    if (!box)

        d.innerHTML = `<input data-in placeholder="Kalem" maxlength="40"><input data-iq type="number" min="0" step="any" inputmode="decimal" placeholder="Miktar"><select data-iu>${ITEM_UNITS.map(u => `<option>${u}</option>`).join("")}</select><button class="chip" type="button" data-ix aria-label="Kaldır">×</button>`;
        box.appendChild(d);
        d.querySelector("[data-ix]").onclick = () => { d.remove(); capturePostDraft(); };
    };
    $("#addit").onclick = add;
    $("#ph").onclick = () => {
        const preview = $("#phs");
        pickImg(u => {
            // Fotoğraf hazırlanırken başka forma geçildiyse yeni taslağa yazma.
            if (tab !== "post" || postMode !== "load" || $("#phs") !== preview) return;
            postImg = u;
            preview.innerHTML = `<img class="th" src="${u}" alt="Yük fotoğrafı">`;

}

const expired = (x, k) => !!(!x._remote && x.ts && Date.now()-x.ts>TTL[k]*864e5) || (validDay(x.date) && (validDay(x.dateEnd)?x.dateEnd:x.date)<localDay());
const availableListing = (x,isT=false) => !!x && !x.archived && !x.closed && !expired(x,isT?"truck":"load") && !(x.uid && blocked.includes(x.uid));
const visibleListing = (x,isT=false) => availableListing(x,isT) && (!nearOn || !nearR || dKm(x)<=nearR) && match(x,isT) && (!q || (x.from+" "+x.to+" "+(x.cargo||x.who||"")).toLocaleLowerCase("tr").includes(q.toLocaleLowerCase("tr")));
function contactAllowed(x,isT=false,allowOwn=false) {
    if(nakgoMarket.locked())return nakgoMarket.pending();
    const current=x&&findIt(isT?"t":"l",x.id);
    if(!availableListing(current,isT)) { toast("Bu ilan artık açık değil. Yeni iletişim başlatılamaz."); return false; }
    if(!allowOwn && ((cloud && current.uid===me)||(!cloud&&current.mine))) { toast("Kendi ilanına mesaj gönderemezsin"); return false; }
    return true;
}

// İlanın sunucuya kaydedildiği an, her cihazda Türkiye saatiyle.
const postedAt = (x, long=false) => {
    if (!Number.isFinite(x.ts)) return "";
    const d=new Date(x.ts), tz={timeZone:"Europe/Istanbul"};
    return d.toLocaleDateString("tr-TR",{...tz,day:"numeric",month:long?"long":"short",...(long?{year:"numeric"}:{})})+" "+d.toLocaleTimeString("tr-TR",{...tz,hour:"2-digit",minute:"2-digit"});
};
const ago = x => {
    if (!x.ts)
        return "";
    const d = Math.floor((Date.now() - x.ts) / 864e5);
    return (d < 1 ? "bugün eklendi" : d + " gün önce") + " · " + postedAt(x);
};

// ===== Bildirim ve alarm =====
// Uygulama içi bildirimler, zil, rota alarmı.

const alertRoute = a => (a.from_city || "Her yer") + " → " + (a.to_city || "Her yer");
function notifs() {
    if (nakgoMarket.active())
        return nakgoAlerts.matches().map(m => ({ k: "r" + m.alert.id + "_" + m.listing.remoteId, fresh: m.fresh, t: "Alarm: " + alertRoute(m.alert) + (m.alert.kind === "truck" ? " yeni boş araç" : " yeni yük"), s: m.listing.from + " → " + m.listing.to + " · " + (m.alert.kind === "truck" ? m.listing.veh + " · " + m.listing.cap + " ton boş" : (m.listing.cargo || "Yük") + " · " + m.listing.ton + " ton"), tab: "list", mode: m.alert.kind }));
    const a = [];
    alerts.forEach(al => loads.filter(l => availableListing(l) && (!al.from || l.from === al.from) && (!al.to || l.to === al.to) && (!al.veh || l.veh === al.veh) && !(l.uid && l.uid === me)).forEach(l => a.push({ k: "a" + al.id + "_" + l.id, t: "Alarm: " + (al.from || "Her yer") + " → " + (al.to || "Her yer") + " yeni yük", s: l.cargo + " · " + l.ton + " ton", tab: "list" })));
    return a;
}

function bell() {
    const b = $("#bc");
    if (!b)
        return;
    const n = notifs().filter(x => nakgoMarket.active() ? x.fresh : !seen.has(x.k)).length;
    b.textContent = n > 9 ? "9+" : n;
    b.style.display = n ? "grid" : "none";
}

function openBell() {
    const a = notifs(), B = $("#sheetBody"), market = nakgoMarket.active();
    const isNew = x => market ? x.fresh : !seen.has(x.k);
    B.dataset.k = "";
    B.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">Bildirimler</b><button class="chip" id="close">Kapat</button></div>` + (a.length ? a.map(x => `<button class="nt ${isNew(x) ? "new" : ""}" data-nt="${x.tab || "list"}" data-nm="${x.mode === "truck" ? "truck" : "load"}"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></button>`).join("") : `<div class="empty">Henüz bildirim yok.<br>Rota alarmına uyan yeni ilanlar burada görünür.</div>`);
    if (market)
        nakgoAlerts.markSeen();
    else {
        seen = new Set([...seen, ...a.map(x => x.k)]);
        try {
            localStorage.setItem("yy-seen", JSON.stringify([...seen]));
        }
        catch (e) { }
    }
    B.querySelectorAll("[data-nt]").forEach(b => b.onclick = () => {
        closeSheet();
        tab = b.dataset.nt || "list";
        mode = b.dataset.nm === "truck" ? "truck" : "load";
        setNav();
        render();
    });
    $("#close").onclick = () => {
        closeSheet();
        render();
    };
    $("#sheet").classList.add("open");
    bell();
}

function addAlert() {
    if (nakgoMarket.guest()) return nakgoMarket.requireAccount();
    if (nakgoMarket.active()) return openAlertForm({ kind: mode === "truck" ? "truck" : "load", from: F.from, to: F.to, veh: F.veh[0] || "", body: F.body[0] || "" });
    if(nakgoMarket.locked())return nakgoMarket.pending();
    const al = { id: Date.now(), from: F.from || "", to: F.to || "", veh: F.veh[0] || "" };
    if (alerts.some(x => x.from === al.from && x.to === al.to && x.veh === al.veh))
        return toast("Bu alarm zaten kurulu");
    alerts.push(al);
    notifs().filter(x => x.k.startsWith("a" + al.id + "_")).forEach(x => seen.add(x.k));
    try {
        localStorage.setItem("yy-seen", JSON.stringify([...seen]));
    }
    catch (e) { }
    if (!save()) return;
    render();
    toast("Alarm kuruldu: " + (al.from || "Her yer") + " → " + (al.to || "Her yer"));
}

// ===== Mesajlaşma =====
// Teklif sohbeti (gerçek kullanıcılar arasında canlı, örnek ilanlarda hazır cevaplı).

function openChat(key, who, onFirstSend, guard) {
    if(nakgoMarket.locked())return nakgoMarket.pending();
    if (!isPrem()) return openPaywall("Uygulama içi mesajlaşma");
    const live = cloud && /^o\d+_./.test(key), B = $("#sheetBody");
    B.dataset.k = key;
    let msgs = live ? [] : (chats[key] = chats[key] || [{ me: 0, t: "Merhaba, nasıl yardımcı olabilirim?" }]);
    const draw = () => {
        if (!$("#msgs") || B.dataset.k !== key)
            return;
        $("#msgs").innerHTML = msgs.map(x => `<div class="bub ${x.me ? "me" : ""}">${esc(x.t)}</div>`).join("");
        $("#msgs").scrollTop = 1e5;
    };
    B.innerHTML = `<div class="load-detail chat-detail"><div class="detail-top"><b>${esc(who)}</b><button class="chip detail-close" id="close" aria-label="Sohbeti kapat">Kapat ×</button></div>${!live ? '<p class="demo-note"><b>Demo sohbet</b> · Mesajlar cihazında tutulur; yanıtlar simüledir.</p>' : ""}<div id="msgs" role="log" aria-live="polite" aria-label="Mesajlar"></div><div class="chat-composer"><label class="sr-only" for="mi">Mesajın</label><input id="mi" placeholder="Mesaj yaz" maxlength="500"><button class="btn" id="ms">Gönder</button></div></div>`;
    if (unChat) {
        unChat();
        unChat = null;
    }
    if (live)
        unChat = db.collection("msgs").where("k", "==", key).onSnapshot(sn => {
            msgs = sn.docs.map(x => x.data()).sort((a, b) => (a.ts || 0) - (b.ts || 0)).map(x => ({ me: x.uid === me, t: String(x.t || "") }));
            draw();
        }, () => { });
    draw();
    syncDetailViewport();
    $("#sheet").classList.add("open");
    $("#close").onclick = closeSheet;
    const send = async () => {
        if (guard && !guard()) return;
        if (!isPrem()) return openPaywall("Uygulama içi mesajlaşma");
        const t = $("#mi").value.trim().slice(0, 500);
        if (!t)
            return;
        if (live) {
            if (onFirstSend && onFirstSend() === false) return;
            if (await dbw(db.collection("msgs").add({ k: key, uid: me, t, ts: Date.now() }))) { onFirstSend=null; if(B.dataset.k===key) $("#mi").value=""; }
            return;
        }
        const oldOffers=JSON.parse(JSON.stringify(offers));
        msgs.push({me:1,t});
        chats[key]=msgs;
        if (onFirstSend && onFirstSend() === false) { msgs=chats[key]||[]; return; }
        if (!save()) { offers=oldOffers; msgs=chats[key]||[]; return; }
        onFirstSend=null;
        $("#mi").value="";
        draw();
        setTimeout(() => {
            msgs.push({ me: 0, t: ["Tamamdır, yarın sabah yüklemeye hazırız.", "Fiyatta biraz esneyebiliriz, ne düşünüyorsun?", "Telefonla konuşalım mı?"][Math.floor(Math.random() * 3)] });
            chats[key]=msgs;
            if (!save()) {msgs=chats[key]||[];}
            draw();
        }, 1500);
    };
    $("#ms").onclick = send;
    $("#mi").onkeydown = e => {
        if (e.key === "Enter")
            send();
    };
}

// ===== Öne çıkan ilan =====
// Öne çıkarma fiyatı, satın alma ekranı, etkinin ölçülmesi ve özeti.

const featPrice = (kind, hrs) => (FEAT.prices[kind] || FEAT.prices.l)[hrs] || 0;

const isDemoFeature = x => !cloud && x.id === 8 && !x.uid && !x.mine;
const isF = x => isDemoFeature(x) || !!x.featUntil && (x.featFrom || 0) <= Date.now() && Date.now() < x.featUntil;

function openFeature(kind, id) {
    if(nakgoMarket.locked())return nakgoMarket.pending();
    const it = findIt(kind, id);
    if (!it)
        return;
    const B = $("#sheetBody");
    B.dataset.k = "";
    const L = kind === "l", active = !!(it.featUntil && it.featUntil > Date.now()), st = active ? it.featUntil : Date.now(), left = active ? Math.max(1, Math.ceil((it.featUntil - Date.now()) / 36e5)) : 0;
    let dur = 6;
    const draw = () => {
        const price = featPrice(kind, dur);
        B.innerHTML = `<b style="font-size:19px">${L ? "İlanını" : "Boş araç ilanını"} öne çıkar</b><div class="route" style="margin-top:10px">${routeHTML(it)}</div>
  <p style="font-size:13px;color:var(--mute);margin:8px 0 12px">Öne çıkan ${L ? "ilanlar" : "boş araç ilanları"} listenin en üstünde "Öne çıkan" etiketiyle gösterilir.${active ? ` Şu an ${left} saat daha öne çıkıyor, yeni süre bitince başlar.` : ""}</p>
  <div class="fopts">${FDUR.map(([h, t]) => {
            const p = featPrice(kind, h);
            return `<button class="fopt ${h === dur ? "on" : ""}" data-fd="${h}"><b>${t}</b><span>${fmt(p)}${h >= 72 ? " · günlük " + fmt(Math.round(p / 3)) : ""}</span></button>`;
        }).join("")}</div>
  <div class="fprice"><b>${fmt(price)}</b><span>${dur >= 72 ? "3 gün" : dur + " saat"} boyunca listenin başında</span></div>
  <button class="btn" id="fbuy">Öne çıkar · ${fmt(price)}</button><p style="font-size:12px;color:var(--mute);text-align:center">Test modu: gerçek ödeme alınmaz.</p><button class="btn alt" id="close">Vazgeç</button>`;
        B.querySelectorAll("[data-fd]").forEach(b => b.onclick = () => {
            dur = +b.dataset.fd;
            draw();
        });
        $("#close").onclick = closeSheet;
        $("#fbuy").onclick = () => {
            const p = featPrice(kind, dur);
            if (!patchIt(kind, id, { featFrom: active ? (it.featFrom || Date.now()) : st, featUntil: st + dur * 36e5, featPaid: (+it.featPaid || 0) + p, featWin: [...featWins(it), [st, st + dur * 36e5]].slice(-10) })) return;
            closeSheet();
            toast(active ? "Öne çıkarma süresi uzatıldı" : "İlanın öne çıkarıldı");
        };
    };
    draw();
    $("#sheet").classList.add("open");
}

const featWins = l => Array.isArray(l.featWin) && l.featWin.length ? l.featWin.map(w => [+w[0] || 0, +w[1] || 0]).filter(w => w[1] > w[0]) : (l.featUntil ? [[l.featFrom || 0, l.featUntil]] : []);

/* Öne çıkarma etkisi: öne çıkarılan saatlerdeki saatlik görüntülenme ile diğer saatlerin karşılaştırması. Neden-sonuç kanıtı değil, kaba bir göstergedir. */
function featEffect(l, E, O, now) {
    const W = featWins(l).map(w => [w[0], Math.min(w[1], now)]).filter(w => w[1] > w[0]);
    if (!W.length)
        return null;
    const start = l.ts || Math.min(...W.map(w => w[0])), inW = t => W.some(w => t >= w[0] && t < w[1]), hF = W.reduce((a, w) => a + (w[1] - w[0]) / 36e5, 0), hO = Math.max(0, (now - start) / 36e5 - hF);
    const V = E.filter(e => e.t === "v").map(e => e.ts), vF = V.filter(inW).length, vO = V.length - vF, oF = O.filter(o => inW(+o.ts || 0)).length, rF = hF > 0 ? vF / hF : 0, rO = hO > 0 ? vO / hO : 0, enough = hF >= 3 && hO >= 3 && V.length >= 8;
    return { demo: false, hF, hO, vF, vO, rF, rO, oF, lift: enough && rO > 0 ? Math.round((rF / rO - 1) * 100) : null, enough };
}

function fxOf(l) {
    const Wn = featWins(l);
    if (!Wn.length)
        return null;
    const now = Date.now();
    if (!cloud) {
        const hF = Wn.reduce((a, w) => a + Math.max(0, Math.min(w[1], now) - w[0]) / 36e5, 0), h = ((l.id * 7919) % 1000) / 1000, rO = +(.5 + h * .6).toFixed(1), rF = +(rO * (1.6 + h * .8)).toFixed(1);
        return { demo: true, hF: Math.max(hF, .1), rO, rF, lift: Math.round((rF / rO - 1) * 100), oF: Math.max(0, Math.round(rF * hF * .05)), enough: true };
    }
    return featEffect(l, events.filter(e => e.loadId === l.id && e.uid !== l.uid), allO.filter(o => o.loadId === l.id), now);
}

/**
 * Harita verisi ve geometri
 * Sağlayıcı, doğrulanmış yol noktaları ve DOM'dan bağımsız Web Mercator hesapları.
 */

const ROAD_MAP = {tiles:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",minZoom:4,maxZoom:17};
// Biçim: {id,name,kind:'tire'|'repair'|'rest',coordinates:[boylam,enlem],source,verifiedAt}.
// Genel OSM işletmeleri NakGo doğrulaması anlamına gelmez; henüz doğrulanmış nokta yok.
const ROAD_STOPS = [];
const ROAD_KINDS = {tire:"Lastikçi",repair:"Tamirci",rest:"Dinlenme tesisi"};

function roadProject([lon,lat],z) {
    const size=256*2**z;
    const sin=Math.sin(Math.max(-85.0511,Math.min(85.0511,lat))*Math.PI/180);
    return [(lon+180)/360*size,(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*size];
}

function roadUnproject([x,y],z) {
    const size=256*2**z;
    return [x/size*360-180,Math.atan(Math.sinh(Math.PI*(1-2*y/size)))*180/Math.PI];
}

function roadStopValid(stop) {
    return !!(stop&&ROAD_KINDS[stop.kind]&&stop.name&&stop.source&&stop.verifiedAt
        &&Array.isArray(stop.coordinates)&&stop.coordinates.length===2
        &&stop.coordinates.every(Number.isFinite)
        &&stop.coordinates[0]>=25&&stop.coordinates[0]<=45
        &&stop.coordinates[1]>=35&&stop.coordinates[1]<=43);
}

function roadStopsFor(kind="") {
    return ROAD_STOPS.filter(stop=>roadStopValid(stop)&&(!kind||stop.kind===kind));
}

function roadFitViewport(points,width,height) {
    const projected=points.map(point=>roadProject(point,0));
    const dx=Math.abs(projected[0][0]-projected[1][0]);
    const dy=Math.abs(projected[0][1]-projected[1][1]);
    // Leave room for city labels, attribution and the existing touch controls.
    const padding={left:70,right:86,top:60,bottom:60};
    const scale=Math.min(Math.max(1,width-padding.left-padding.right)/Math.max(dx,.5),Math.max(1,height-padding.top-padding.bottom)/Math.max(dy,.5));
    const zoom=Math.max(ROAD_MAP.minZoom,Math.min(10,Math.floor(Math.log2(scale))));
    return {
        zoom,
        center:roadUnproject([(projected[0][0]+projected[1][0])/2+(padding.right-padding.left)/2/2**zoom,(projected[0][1]+projected[1][1])/2],0)
    };
}

/**
 * Harita hareketleri ve yaşam döngüsü
 * Görünen döşemeler, dokunma, klavye, boyutlandırma ve kaynakların serbest bırakılması.
 */

const roadMaps = new Set();

function createRoadMapController(el,onViewChange=()=>{}) {
    const viewport=el.querySelector('.road-viewport'),pane=el.querySelector('.road-pane');
    const tiles=el.querySelector('.road-tiles'),pins=el.querySelector('.road-pins');
    const status=el.querySelector('.road-status span'),retry=el.querySelector('[data-map-action=retry]');
    const from=el.dataset.from,to=el.dataset.to,route=LL[from]&&LL[to];
    const points=route?[LL[from],LL[to]]:[[25.6,35.7],[44.9,42.3]];
    let zoomLevel=ROAD_MAP.minZoom,center=[35.25,39],width=0,height=0;
    let active=false,disposed=false,category='',serial=0,resizeObserver,intersectionObserver,frame;
    const fingers=new Map();
    let gesture=null,fitted=true;

    function clampCenter() {
        center=[Math.max(24,Math.min(46,center[0])),Math.max(34,Math.min(44,center[1]))];
    }
    function fit() {
        const view=roadFitViewport(points,width,height);
        zoomLevel=view.zoom;center=view.center;clampCenter();
    }
    function drawTiles(left,top) {
        const count=2**zoomLevel,keep=new Set(),ticket=++serial;
        let pending=0,failed=0;
        function settle() {
            if(ticket!==serial||disposed)return;
            status.textContent=failed?'Harita yüklenemedi.':pending?'Harita yükleniyor…':'';
            retry.hidden=!failed;
        }
        for(let x=Math.floor(left/256);x<=Math.floor((left+width)/256);x++) {
            for(let y=Math.floor(top/256);y<=Math.floor((top+height)/256);y++) {
                if(x<0||y<0||x>=count||y>=count)continue;
                const key=zoomLevel+'-'+x+'-'+y;keep.add(key);
                let img=tiles.querySelector(`[data-tile="${key}"]`);
                if(!img) {
                    img=document.createElement('img');img.dataset.tile=key;img.alt='';img.draggable=false;
                    img.referrerPolicy='strict-origin-when-cross-origin';tiles.appendChild(img);
                    img.src=ROAD_MAP.tiles.replace('{z}',zoomLevel).replace('{x}',x).replace('{y}',y);
                }
                img.style.transform=`translate(${Math.round(x*256-left)}px,${Math.round(y*256-top)}px)`;
                if(img.complete) {if(!img.naturalWidth)failed++;}
                else {pending++;img.onload=()=>{pending--;settle();};img.onerror=()=>{pending--;failed++;settle();};}
            }
        }
        tiles.querySelectorAll('img').forEach(img=>{
            if(!keep.has(img.dataset.tile)) {img.onload=img.onerror=null;img.remove();}
        });
        settle();
    }
    function drawPins(left,top) {
        let connection='';
        if(route) {
            const [a,b]=points.map(point=>roadProject(point,zoomLevel).map((value,index)=>value-(index?top:left)));
            el.classList.toggle('road-close-pins',Math.abs(a[0]-b[0])<140&&Math.abs(a[1]-b[1])<65);
            connection=`<svg class="road-connection" width="${width}" height="${height}" aria-hidden="true"><path class="road-connection-halo" d="M${a[0]},${a[1]} L${b[0]},${b[1]}"/><path d="M${a[0]},${a[1]} L${b[0]},${b[1]}"/></svg>`;
        }
        const markers=route?[
            {name:from,coordinates:LL[from],label:'Çıkış',className:'start'},
            {name:to,coordinates:LL[to],label:'Varış',className:'finish'}
        ]:[];
        markers.push(...roadStopsFor(category).map(stop=>({...stop,label:ROAD_KINDS[stop.kind],className:'stop'})));
        pins.innerHTML=connection+markers.map(marker=>{
            const point=roadProject(marker.coordinates,zoomLevel),x=point[0]-left,y=point[1]-top;
            if(x<0||y<0||x>width||y>height)return '';
            return `<div class="road-pin ${marker.className}" style="left:${x}px;top:${y}px"><i aria-hidden="true">${marker.className==='start'?'A':marker.className==='finish'?'B':''}</i><span><small class="sr-only">${esc(marker.label)}: </small>${esc(marker.name)}</span></div>`;
        }).join('');
    }
    function draw() {
        if(!active||disposed||width<1)return;
        pane.style.transform='';pane.style.transformOrigin='';
        el.dataset.zoom=zoomLevel;el.dataset.center=center.map(value=>value.toFixed(5)).join(',');
        const projected=roadProject(center,zoomLevel),left=projected[0]-width/2,top=projected[1]-height/2;
        drawTiles(left,top);drawPins(left,top);
        el.querySelector('[data-map-action=in]').disabled=zoomLevel>=ROAD_MAP.maxZoom;
        el.querySelector('[data-map-action=out]').disabled=zoomLevel<=ROAD_MAP.minZoom;
    }
    function zoom(delta,anchor=[width/2,height/2]) {
        const next=Math.max(ROAD_MAP.minZoom,Math.min(ROAD_MAP.maxZoom,zoomLevel+delta));
        if(next===zoomLevel)return;
        fitted=false;
        const projected=roadProject(center,zoomLevel);
        const geo=roadUnproject([projected[0]+anchor[0]-width/2,projected[1]+anchor[1]-height/2],zoomLevel);
        zoomLevel=next;
        const point=roadProject(geo,zoomLevel);
        center=roadUnproject([point[0]-anchor[0]+width/2,point[1]-anchor[1]+height/2],zoomLevel);
        clampCenter();draw();
    }
    function resetView() {fitted=true;fit();draw();onViewChange('');}
    el.querySelectorAll('[data-map-action]').forEach(button=>button.onclick=()=>{
        const action=button.dataset.mapAction;
        if(action==='in'||action==='out')zoom(action==='in'?1:-1);
        if(action==='fit')resetView();
        if(action==='retry') {
            tiles.querySelectorAll('img').forEach(img=>{if(img.complete&&!img.naturalWidth)img.remove();});draw();
        }
    });
    function position(event) {
        const rect=viewport.getBoundingClientRect();return [event.clientX-rect.left,event.clientY-rect.top];
    }
    function midpoint(points) {
        return points.length>1?[(points[0][0]+points[1][0])/2,(points[0][1]+points[1][1])/2]:points[0];
    }
    function distance(points) {
        return points.length>1?Math.hypot(points[1][0]-points[0][0],points[1][1]-points[0][1]):0;
    }
    function beginGesture() {
        const points=[...fingers.values()];
        gesture={mid:midpoint(points),center:roadProject(center,zoomLevel),distance:distance(points)};
    }
    viewport.onpointerdown=event=>{
        if(event.button&&event.button!==0)return;
        viewport.setPointerCapture(event.pointerId);fingers.set(event.pointerId,position(event));beginGesture();
    };
    viewport.onpointermove=event=>{
        if(!fingers.has(event.pointerId)||!gesture)return;
        fingers.set(event.pointerId,position(event));
        const points=[...fingers.values()],mid=midpoint(points);
        const ratio=points.length>1&&gesture.distance?Math.max(.25,Math.min(4,distance(points)/gesture.distance)):1;
        pane.style.transformOrigin=gesture.mid[0]+'px '+gesture.mid[1]+'px';
        pane.style.transform=`translate(${mid[0]-gesture.mid[0]}px,${mid[1]-gesture.mid[1]}px) scale(${ratio})`;
    };
    viewport.onpointerup=event=>{
        if(!fingers.has(event.pointerId)||!gesture)return;
        const points=[...fingers.values()],mid=midpoint(points);
        fitted=false;
        center=roadUnproject([gesture.center[0]-mid[0]+gesture.mid[0],gesture.center[1]-mid[1]+gesture.mid[1]],zoomLevel);
        clampCenter();
        if(points.length>1&&gesture.distance)zoom(Math.round(Math.log2(Math.max(.25,distance(points)/gesture.distance))),mid);
        fingers.delete(event.pointerId);gesture=null;
        if(fingers.size)beginGesture();
        draw();onViewChange('');
    };
    viewport.onpointercancel=()=>{fingers.clear();gesture=null;pane.style.transform='';pane.style.transformOrigin='';};
    viewport.onkeydown=event=>{
        const actions={'+':()=>zoom(1),'=':()=>zoom(1),'-':()=>zoom(-1),'0':resetView};
        if(actions[event.key]) {event.preventDefault();actions[event.key]();return;}
        if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
        fitted=false;
        event.preventDefault();
        const point=roadProject(center,zoomLevel);
        point[0]+=event.key==='ArrowLeft'?-80:event.key==='ArrowRight'?80:0;
        point[1]+=event.key==='ArrowUp'?-80:event.key==='ArrowDown'?80:0;
        center=roadUnproject(point,zoomLevel);clampCenter();draw();onViewChange('');
    };
    viewport.onwheel=event=>{
        if(!event.ctrlKey)return;
        event.preventDefault();zoom(event.deltaY<0?1:-1,position(event));
    };
    function size() {
        const rect=viewport.getBoundingClientRect();
        if(rect.width<1||rect.height<1)return;
        const initial=!width;width=rect.width;height=rect.height;
        if(initial||fitted)fit();draw();
    }
    function activate() {
        if(active||disposed)return;
        active=true;size();
        if(typeof ResizeObserver!=='undefined') {resizeObserver=new ResizeObserver(size);resizeObserver.observe(viewport);}
    }
    if(typeof IntersectionObserver!=='undefined') {
        intersectionObserver=new IntersectionObserver(entries=>{
            if(entries.some(entry=>entry.isIntersecting)) {activate();intersectionObserver.disconnect();}
        },{rootMargin:'30px'});
        intersectionObserver.observe(el);
    } else frame=requestAnimationFrame(activate);

    return {
        el,
        category(value) {category=value;draw();},
        focus(city) {
            if(LL[city]) {fitted=false;center=LL[city].slice();zoomLevel=11;draw();}
            else resetView();
        },
        dispose() {
            disposed=true;intersectionObserver?.disconnect();resizeObserver?.disconnect();
            if(frame)cancelAnimationFrame(frame);
            tiles.querySelectorAll('img').forEach(img=>img.onload=img.onerror=null);
            el.querySelectorAll('[data-map-action]').forEach(button=>button.onclick=null);
            viewport.onpointerdown=viewport.onpointermove=viewport.onpointerup=viewport.onpointercancel=null;
            viewport.onkeydown=viewport.onwheel=null;
            fingers.clear();delete el.dataset.bound;
        }
    };
}

let postStep = 0, postDrafts = null, postDraftSaved = true;
function getPostDrafts() {
    if (postDrafts) return postDrafts;
    if(nakgoMarket.active())return postDrafts={};
    try { const d=JSON.parse(localStorage.getItem("ng-post-drafts") || "{}"); postDrafts=isRecord(d)?d:{}; }
    catch (e) { postDrafts={}; }
    return postDrafts;
}
function persistPostDrafts() {
    if(nakgoMarket.active()){const status=$("#main .draft-state");if(status)status.textContent="Taslak bu oturumda tutuluyor";return true;}
    const previouslySaved = postDraftSaved;
    try { localStorage.setItem("ng-post-drafts", JSON.stringify(getPostDrafts())); postDraftSaved=true; }
    catch (e) {
        postDraftSaved=false;
        if (previouslySaved) toast("Taslak kaydedilemedi. Sayfayı kapatmadan depolama alanını kontrol et.");
    }
    const status = $("#main .draft-state");
    if (status) {
        status.textContent = postDraftSaved ? "Taslak kaydedildi" : "Taslak kaydedilemedi";
        status.dataset.saved = String(postDraftSaved);
    }
    return postDraftSaved;
}
function capturePostDraft() {
    if (tab !== "post" || !document.querySelectorAll) return;
    const fields = {};
    document.querySelectorAll('#main input[id], #main select[id], #main textarea[id]').forEach(e => fields[e.id] = e.value);
    const items = [...document.querySelectorAll('#its .itrow')].map(e => ({n:e.querySelector('[data-in]').value,q:e.querySelector('[data-iq]').value,u:e.querySelector('[data-iu]').value}));
    const drafts = getPostDrafts(); drafts[postMode] = {fields, items, image: postImg, step: postStep};
    return persistPostDrafts();
}
function clearPostDraft(kind=postMode) {
    const drafts=getPostDrafts(); delete drafts[kind];
    return persistPostDrafts();
}
function initPostWizard(m) {

    if (!m.insertAdjacentHTML) return;

    postStep=draft ? Math.max(0,Math.min(2,+draft.step||0)) : 0;
    if (draft) {
        for(const id of ['f','t','v','w','bd','d','c','b','n','post-phone']) { const value=isRecord(draft.fields)?draft.fields[id]:undefined; const e=m.querySelector('#'+id); if(e&&typeof value==='string'&&(e.tagName!=='SELECT'||[...e.options].some(o=>o.value===value)))e.value=id==='d' && postMode==='truck' && postDateOK(value) ? postDateText(dateFields(value).date) : value; }
        bindDistricts();

        if(postMode==='load') {
            for(const item of (Array.isArray(draft.items)?draft.items:[]).filter(isRecord).slice(0,6)) { $('#addit').onclick(); const e=$('#its').lastElementChild; e.querySelector('[data-in]').value=typeof item.n==='string'?item.n:''; e.querySelector('[data-iq]').value=typeof item.q==='string'||Number.isFinite(item.q)?item.q:''; if(ITEM_UNITS.includes(item.u))e.querySelector('[data-iu]').value=item.u; }
            if(imgOk(draft.image)){postImg=draft.image;$('#phs').innerHTML=`<img class="th" src="${postImg}" alt="Taslak yük fotoğrafı">`;}
        }
    }
    const start1=postMode==='load'?$('#c').previousElementSibling:$('#v').closest('.row');
    const start2=postMode==='load'?$('#n').previousElementSibling:$('#d').previousElementSibling;
    const nodes=[...m.children].filter(e=>!e.classList.contains('seg'));
    const groups=[0,1,2].map(i=>{const s=document.createElement('section');s.className='form-section';s.dataset.step=i; m.appendChild(s);return s;});
    let step=0;for(const e of nodes){if(e===start1)step=1;if(e===start2)step=2;groups[step].appendChild(e);}
    m.insertAdjacentHTML('afterbegin',screenHeading('İlan oluştur',draft?'Taslağına devam ediyorsun.':'Güzergâhı seç, bilgileri ekle ve yayınla.')+demoNotice()+`<ol class="form-steps"><li>1 · Güzergâh</li><li>2 · ${postMode==='load'?'Yük ve taşıma':'Araç'}</li><li>3 · ${postMode==='load'?'Not ve ekler':'Müsaitlik'}</li></ol>`);
    m.insertAdjacentHTML('beforeend','<div class="form-dock"><button class="chip" id="post-prev">Geri</button><span class="draft-state" role="status">Taslak kaydediliyor…</span><button class="btn" id="post-next">Devam →</button></div>');
    m.querySelector('.form-dock').appendChild($('#go'));
    const show=()=>{groups.forEach((e,i)=>e.hidden=i!==postStep);m.querySelectorAll('.form-steps li').forEach((e,i)=>e.setAttribute('aria-current',i===postStep?'step':'false'));$('#post-prev').hidden=postStep===0;$('#post-next').hidden=postStep===2;$('#go').hidden=postStep!==2;m.scrollTop=0;capturePostDraft();};
    $('#post-prev').onclick=()=>{postStep--;show();};
    $('#post-next').onclick=()=>{
        const error=postError(postValues(),postMode==='truck',postStep);
        if(error)return toast(error);
        postStep++;show();
    };
    m.oninput=capturePostDraft;m.onchange=capturePostDraft;
    m.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{const label=e.previousElementSibling;if(label&&label.tagName==='LABEL')label.htmlFor=e.id;});
    show();
}

function initDialogAccessibility() {
    try {
        const sheet=$("#sheet"),body=$("#sheetBody");
        const background=[$('#main'),$('#nav'),document.querySelector('header')];
        let previousFocus=null,wasOpen=false;
        const syncFocus=()=>{
            const open=sheet.classList.contains('open');
            if(open&&!wasOpen)previousFocus=document.activeElement;
            background.forEach(element=>{if(element)element.inert=open;});
            if(open) {
                body.setAttribute('aria-label',body.querySelector('.detail-top>b,.detail-top>span,h2')?.textContent||'NakGo penceresi');
                body.setAttribute('tabindex','-1');
                // İçerik değiştirilince eski odak DOM'dan çıkar; mobil klavyeyi açmadan güvenli düğmeye dön.
                if(!body.contains(document.activeElement)) (body.querySelector('#map-back,#close,#cx,button')||body).focus();
            } else if(wasOpen) {
                const target=previousFocus?.isConnected?previousFocus:
                    previousFocus?.id?document.getElementById(previousFocus.id):null;
                target?.focus({preventScroll:true});
            }
            wasOpen=open;
        };
        new MutationObserver(syncFocus).observe(sheet,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
        syncFocus();
        document.addEventListener('keydown',event=>{
            if(event.key!=='Tab'||!sheet.classList.contains('open'))return;
            const items=[...body.querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex="0"]')]
                .filter(element=>element.getClientRects().length&&!element.disabled);
            if(!items.length) {event.preventDefault();body.focus();return;}
            const first=items[0],last=items.at(-1);
            if(event.shiftKey&&(document.activeElement===first||document.activeElement===body)) {
                event.preventDefault();last.focus();
            } else if(!event.shiftKey&&document.activeElement===last) {event.preventDefault();first.focus();}
        });
    } catch(e) { }
}

const nakgoAdminAccess=(()=>{
    let generation=0,account='',ready=false,busy=false,authorized=false;
    const isAdmin=()=>nakgoMarket.active()&&ready&&authorized&&account===nakgoMarket.token();
    function reset(){generation++;account='';ready=busy=authorized=false;}
    // Profil yüklenmeden gelen "giriş gerekli" hatası ret sayılmaz; profil gelince yeniden sorulur.
    async function refresh(){
        if(!nakgoMarket.active()||busy)return;
        const current=nakgoMarket.token(),ticket=++generation;busy=true;authorized=false;let retry=false;
        try{const role=await nakgoAuth.adminRole();if(ticket!==generation||current!==nakgoMarket.token())return;account=current;authorized=role===true;ready=true;}
        catch(error){if(ticket===generation&&current===nakgoMarket.token()){if(error?.message==='Sign in required')retry=true;else{account=current;authorized=false;ready=true;}}}
        finally{if(ticket===generation&&current===nakgoMarket.token()){busy=false;if(!retry&&(tab==='me'||ADMIN_HOST))render();}}
    }
    function ensure(){if(nakgoMarket.active()&&!busy&&(!ready||account!==nakgoMarket.token()))refresh();}
    const checked=()=>ready&&account===nakgoMarket.token();
    return {isAdmin,checked,reset,refresh,ensure};
})();
