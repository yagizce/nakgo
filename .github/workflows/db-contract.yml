name: NakGo database contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: db-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  db-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Production Supabase PostgreSQL 17 çalıştırır; testler aynı ana sürümde koşar. Dış ağ veya gizli anahtar yok.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated database test engines
        run: |
          npm install --prefix "$RUNNER_TEMP/nakgo-admin-db" --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
          npm install --prefix "$RUNNER_TEMP/nakgo-pg" --no-save --package-lock=false --ignore-scripts pg@8.23.1
      - name: Install pinned backup tools (age, PostgreSQL 17 client)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr"{print $10; exit}')" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo cp "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Install PostgreSQL 17 server tree (disposable clusters)
        # tools/backup/pg-cluster.cjs, NAKGO_PG_SERVER altında bin/, lib/ ve share/ içeren taşınabilir bir kurulum ister
        # (pg_cron taklidini kopyanın share/ klasörüne yazar); Debian paketinde share/ ayrı yerde olduğu için uygun değil.
        # Testler bu kurulumla yalnız Unix soketli, geçici kümeler açar; servis veritabanına dokunmaz.
        # Paket dosyası kurulumdan önce sabit SHA-512 ile denetlenir (npm yayın kaydındaki dist.integrity ile aynı değer).
        # Kütüphane bağlantı listesi güvenilmeyen veri sayılır: önce bütün kayıtlar denetlenir, sonra bağlantılar kurulur.
        run: |
          TGZ_DIR="$RUNNER_TEMP/nakgo-pg-server-tgz"
          TGZ="$TGZ_DIR/embedded-postgres-linux-x64-17.11.0-beta.19.tgz"
          mkdir -p "$TGZ_DIR"
          npm pack --ignore-scripts --pack-destination "$TGZ_DIR" @embedded-postgres/linux-x64@17.11.0-beta.19
          echo "320d9252255fd135bdbc408ef2a7efe35ef7d1680938a82e39a2b869c52e201e0bf07795ba26204339488f6921ef743738bc5175eb9bec3f02fd2904c4c96aae  $TGZ" | sha512sum --check
          npm install --prefix "$RUNNER_TEMP/nakgo-pg-server" --no-save --package-lock=false --ignore-scripts "$TGZ"
          PKG="$RUNNER_TEMP/nakgo-pg-server/node_modules/@embedded-postgres/linux-x64"
          node - "$PKG" <<'JS'
          const fs=require('fs'),p=require('path');
          const fail=m=>{console.error('pg-symlinks reddedildi: '+m);process.exit(1);};
          const root=fs.realpathSync(process.argv[2]),lib=p.join(root,'native','lib');
          const under=(x,d)=>x.startsWith(d+p.sep);
          const exists=x=>{try{fs.lstatSync(x);return true;}catch{return false;}};
          let list;try{list=JSON.parse(fs.readFileSync(p.join(root,'native','pg-symlinks.json'),'utf8'));}catch{fail('liste okunamadı');}
          if(!Array.isArray(list)||!list.length)fail('liste boş ya da dizi değil');
          if(fs.realpathSync(lib)!==lib)fail('native/lib sembolik bağlantı');
          const plan=[],seen=new Set();
          for(const l of list){
            if(!l||typeof l.source!=='string'||typeof l.target!=='string')fail('geçersiz kayıt');
            for(const s of [l.source,l.target])
              if(p.isAbsolute(s)||/[\\\0]/.test(s)||s.split('/').some(x=>x===''||x==='.'||x==='..'))fail('güvenli olmayan yol: '+JSON.stringify(s));
            const src=p.join(root,l.source),tgt=p.join(root,l.target);
            if(!under(src,lib)||!under(tgt,lib))fail('native/lib dışında yol: '+JSON.stringify(l));
            if(!exists(src)||!fs.lstatSync(src).isFile())fail('kaynak normal dosya değil: '+l.source);
            if(fs.realpathSync(src)!==src)fail('kaynak yolu sembolik bağlantıdan geçiyor: '+l.source);
            if(fs.realpathSync(p.dirname(tgt))!==p.dirname(tgt))fail('hedef klasörü sembolik bağlantıdan geçiyor: '+l.target);
            if(exists(tgt))fail('hedef zaten var: '+l.target);
            if(seen.has(tgt))fail('yinelenen hedef: '+l.target);
            seen.add(tgt);plan.push({src,tgt});
          }
          for(const {src,tgt} of plan)fs.symlinkSync(p.relative(p.dirname(tgt),src),tgt);
          for(const {src,tgt} of plan)if(fs.realpathSync(tgt)!==src)fail('bağlantı beklenen dosyaya çözülmüyor: '+tgt);
          console.log('pg-symlinks: '+plan.length+' bağlantı kuruldu');
          JS
          "$PKG/native/bin/postgres" --version | grep -E '^postgres \(PostgreSQL\) 17\.'
          "$PKG/native/bin/initdb" --version
      - name: PGlite (PostgreSQL 17, in-process)
        env:
          NODE_PATH: ${{ runner.temp }}/nakgo-admin-db/node_modules
          NAKGO_REQUIRE_AGE: '1'
        run: npm run -s test:db
      - name: Real PostgreSQL 17 server
        env:
          NODE_PATH: ${{ runner.temp }}/nakgo-pg/node_modules
          NAKGO_PG_HOST: localhost
          NAKGO_PG_PORT: '5432'
          NAKGO_PG_PASSWORD: ci-only-local
          NAKGO_PG_BIN: /usr/lib/postgresql/17/bin
          NAKGO_PG_SERVER: ${{ runner.temp }}/nakgo-pg-server/node_modules/@embedded-postgres/linux-x64/native
          NAKGO_REQUIRE_DUMP: '1'
          NAKGO_REQUIRE_AGE: '1'
        run: npm run -s test:db
