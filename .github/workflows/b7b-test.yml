name: NakGo B7-B test
# B7-B kabul testleri (docs/backup/b7b-acceptance.md). YALNIZ GEÇİCİ TEST KAYNAKLARI: geçici Supabase test projesi ve
# ayrı R2 test kovası. Production, DEV ve production gizlileri bu iş akışında YOKTUR.
# - Yalnız elle tetiklenir (workflow_dispatch); push, pull_request ve zamanlama YOK.
# - Yalnız nakgo/b7b-test dalında çalışır (iş koşulu + çalıştırıcıdaki ikinci kapı).
# - Yalnız "backup-test" ortamının gizlilerini kullanır; ortamda zorunlu onaylayıcı ve dal kısıtı olmalıdır.
# - Anahtarlar (K1, K2, K7, age alıcıları) her çalışmada üretilir ve iş bitince yok olur; gizli olarak saklanmaz.
# Ortam, gizliler, test projesi ve kova OLUŞTURULMADI; her biri ayrı onaydır.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test takımı (r2 → supabase-base → supabase-legal125 sırasıyla)
        required: true
        type: choice
        options: [r2, supabase-base, supabase-legal125]
permissions:
  contents: read
concurrency:
  group: nakgo-b7b-test
  cancel-in-progress: false
jobs:
  b7b:
    if: github.ref == 'refs/heads/nakgo/b7b-test' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: backup-test
    services:
      # V8 geri yükleme testi için yalıtılmış, geçici PostgreSQL 17. İş bitince yok olur.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned client library
        run: npm install --prefix "$RUNNER_TEMP/nakgo-pg" --no-save --package-lock=false --ignore-scripts pg@8.23.1
      - name: Install pinned backup tools (age, PostgreSQL 17 client)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr"{print $10; exit}')" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo cp "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Write test database root certificate
        if: inputs.suite != 'r2'
        env:
          ROOT_CERT: ${{ secrets.NAKGO_TEST_DB_ROOT_CERT }}
        run: |
          umask 077
          printf '%s\n' "$ROOT_CERT" > "$RUNNER_TEMP/test-db-root.crt"
      - name: B7-B acceptance tests
        env:
          NODE_PATH: ${{ runner.temp }}/nakgo-pg/node_modules
          NAKGO_TEST_SUITE: ${{ inputs.suite }}
          NAKGO_TEST_ENVIRONMENT: backup-test
          NAKGO_PG_BIN: /usr/lib/postgresql/17/bin
          NAKGO_PG_HOST: localhost
          NAKGO_PG_PORT: '5432'
          NAKGO_PG_PASSWORD: restore-test-only
          NAKGO_TEST_R2_ENDPOINT: ${{ secrets.NAKGO_TEST_R2_ENDPOINT }}
          NAKGO_TEST_R2_BUCKET: ${{ secrets.NAKGO_TEST_R2_BUCKET }}
          NAKGO_TEST_R2_ACCESS_KEY_ID: ${{ secrets.NAKGO_TEST_R2_ACCESS_KEY_ID }}
          NAKGO_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.NAKGO_TEST_R2_SECRET_ACCESS_KEY }}
          NAKGO_TEST_DB_PROJECT_REF: ${{ secrets.NAKGO_TEST_DB_PROJECT_REF }}
          NAKGO_TEST_DB_HOST: ${{ secrets.NAKGO_TEST_DB_HOST }}
          NAKGO_TEST_DB_ADMIN_USER: ${{ secrets.NAKGO_TEST_DB_ADMIN_USER }}
          NAKGO_TEST_DB_ADMIN_PASSWORD: ${{ secrets.NAKGO_TEST_DB_ADMIN_PASSWORD }}
          NAKGO_TEST_DB_ROOT_CERT_FILE: ${{ runner.temp }}/test-db-root.crt
        run: node tools/backup/b7b/run.cjs
      - name: Remove temporary files
        if: always()
        run: rm -f "$RUNNER_TEMP/test-db-root.crt"
