name: NakGo quality gate
run-name: trusted-ci:${{ github.event.pull_request.number || inputs.pr }}:${{ github.sha }}
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Maintenance PR number (protected bootstrap branch only)
        required: true
        type: string
permissions: {}
concurrency:
  group: nakgo-trusted-ci-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.snapshot.outputs.source }}
      base: ${{ steps.snapshot.outputs.base }}
      head: ${{ steps.snapshot.outputs.head }}
      merge: ${{ steps.snapshot.outputs.merge }}
      tree: ${{ steps.snapshot.outputs.tree }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind test merge commit
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/trusted-ci.js snapshot
  candidate-tests:
    name: candidate-tests
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.snapshot.outputs.merge }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked packages
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Existing npm test
        run: npm test
      - name: Install browser runner
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install chromium
      - name: Existing browser tests
        run: npm run test:e2e
      - name: Mobile output
        run: npm run mobile:prepare
  baseline-regressions:
    name: baseline-regressions
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.snapshot.outputs.merge }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.snapshot.outputs.source }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Restore trusted test suite
        env:
          SOURCE_SHA: ${{ needs.snapshot.outputs.source }}
          MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
        run: |
          git -c core.quotePath=false ls-tree -r HEAD | awk '$1 == "120000" || $1 == "160000" || /[\t\/]node_modules\// { bad = 1 } END { exit bad }'
          replay="$(mktemp -d "$RUNNER_TEMP/nakgo-replay.XXXXXX")"
          python -I ../baseline/tests/gate/prepare-replay.py --root . --base-sha "$SOURCE_SHA" --head-sha "$MERGE_SHA" --output "$replay/product.patch" --publication-output "$replay/publication.patch"
          git restore --source="$SOURCE_SHA" --worktree -- tests supabase/tests tools .github
          for patch in "$replay/product.patch" "$replay/publication.patch"; do
            if [ -s "$patch" ]; then
              git apply --check "$patch"
              git apply "$patch"
            fi
          done
      - name: Trusted bundle verification
        run: node tools/bundle.js --check
      - name: Install trusted regression dependencies
        run: |
          python -I -m pip install -r tests/requirements.txt
          python -I -m playwright install chromium
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/nakgo-admin-db" --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
          mkdir -p "$RUNNER_TEMP/nakgo-unit"
          cp "$GITHUB_WORKSPACE/baseline/tests/gate/isolated-deps/"package*.json "$RUNNER_TEMP/nakgo-unit/"
          npm ci --prefix "$RUNNER_TEMP/nakgo-unit" --ignore-scripts --no-fund --no-audit
      - name: Trusted browser regressions
        run: |
          python -E -s tests/e2e.py
          mkdir -p work
          python -I tests/admin_panel_browser.py
          python -I tests/admin_tools_browser.py
      - name: Trusted RLS and Storage regressions
        run: NODE_PATH="$RUNNER_TEMP/nakgo-admin-db/node_modules" node tools/admin-db-check.cjs
      - name: Trusted unit tests
        run: |
          export NAKGO_UNIT_RUNTIME="$RUNNER_TEMP/nakgo-unit"
          node --test tests/gate/isolated-js.test.cjs
          node tests/run.js --isolated
  quality-gate:
    name: quality-gate
    needs: [snapshot, candidate-tests, baseline-regressions]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require isolated test jobs
        env:
          CANDIDATE_RESULT: ${{ needs.candidate-tests.result }}
          BASELINE_RESULT: ${{ needs.baseline-regressions.result }}
        run: test "$CANDIDATE_RESULT" = success && test "$BASELINE_RESULT" = success
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.snapshot.outputs.merge }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.snapshot.outputs.source }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Trusted automation tests
        env:
          SOURCE_SHA: ${{ needs.snapshot.outputs.source }}
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          node --test baseline/tests/gate/control.test.js baseline/tests/gate/trusted-ci.test.js
          python -I baseline/tests/gate/prepare_replay_test.py
      - name: Static and security checks
        run: |
          git -C candidate ls-tree -r HEAD | awk '$1 == "120000" || $1 == "160000" { bad = 1 } END { exit bad }'
          node baseline/tests/gate/static.js candidate
          python -I baseline/tests/gate/static_html.py candidate
      - name: Runtime dependency audit
        run: |
          audit_dir="$(mktemp -d "$RUNNER_TEMP/nakgo-audit.XXXXXX")"
          cp candidate/package.json candidate/package-lock.json "$audit_dir/"
          cd "$audit_dir"
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Workflow syntax checks
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= candidate/.github/workflows/*.yml
      - name: Install browser runner
        run: |
          python -I -m pip install -r baseline/tests/requirements.txt
          python -I -m playwright install chromium
      - name: Independent browser tests
        env:
          BASE_SHA: ${{ needs.snapshot.outputs.source }}
        run: python -I baseline/tests/gate/browser.py --root candidate --base-sha "$BASE_SHA"
  publish:
    needs: [snapshot, candidate-tests, baseline-regressions, quality-gate]
    if: ${{ always() && needs.snapshot.result == 'success' && needs.candidate-tests.result == 'success' && needs.baseline-regressions.result == 'success' && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    environment: nakgo-ci-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish App check for the verified PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_CALLER_REF: ${{ github.workflow_ref }}
          CI_CALLER_SHA: ${{ github.workflow_sha }}
          CI_APP_KEY: ${{ secrets.NAKGO_CI_APP_KEY }}
          CI_APP_ID: ${{ vars.NAKGO_CI_APP_ID }}
          CI_INSTALLATION_ID: ${{ vars.NAKGO_CI_INSTALLATION_ID }}
          CI_SNAPSHOT: ${{ toJSON(needs.snapshot.outputs) }}
          CI_VERIFY: ${{ needs.candidate-tests.result }}
          CI_REGRESSIONS: ${{ needs.baseline-regressions.result }}
          CI_GATE: ${{ needs.quality-gate.result }}
        run: node .github/scripts/trusted-ci.js publish
